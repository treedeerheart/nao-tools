<style>
:root{
  --parch:#f3ead5; --parch-2:#ece0c4; --parch-3:#e2d3b1; --parch-deep:#d8c59c;
  --ink:#3a3127; --ink-2:#5b4f3f; --ink-3:#8a7b63; --ink-faint:rgba(58,49,39,.18);
  --teal:#4f8e90; --teal-deep:#2f696c; --teal-light:#8fbebb; --teal-pale:#cfe3dc; --canal:#7fb3b5;
  --fundw:#3d6f63; --ochre:#c38b3c; --ochre-deep:#9b6a27; --rust:#a9472c; --gold:#cf9f3a;
  --green:#7d9870; --green-deep:#566f4f; --green-pale:#b6c39f; --sand:#dcc9a3; --slate:#6d675c;
  --seal:#a3322a; --title:#2b4944; --care:#b5643c; --mill:#5f9db0; --mill-deep:#2f6f80; --line:#c9a650; --line-deep:#9b7a2a;
  --serif:"EB Garamond", Georgia, "Times New Roman", serif;
  --caps:"Cinzel", "Trajan Pro", Georgia, serif;
  --shadow:0 10px 30px rgba(58,49,39,.22), 0 2px 6px rgba(58,49,39,.15);
  --bar-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
#app{height:100%;position:relative}
body{
  background-color:var(--parch);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(255,250,235,.55), rgba(255,250,235,0) 60%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(120,90,40,.16) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.2  0 0 0 .09 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.caps{font-family:var(--caps);letter-spacing:.08em}

/* ---------- top bar ---------- */
#bar{
  position:relative; z-index:20; height:var(--bar-h); display:flex; align-items:center; gap:12px;
  padding:0 16px; border-bottom:1px solid var(--ink-faint);
  background:linear-gradient(var(--parch),rgba(243,234,213,.92));
}
#bar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--ink-faint)}
.brand{min-width:0;flex:0 1 auto}
.brand h1{margin:0;font-family:var(--caps);font-weight:700;font-size:22px;letter-spacing:.07em;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-style:italic;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar nav{display:flex;gap:5px;margin-left:auto;align-items:center;flex-wrap:nowrap}
.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--caps);font-size:12.5px;letter-spacing:.07em;font-weight:600;
  padding:7px 11px;border-radius:3px;border:1px solid rgba(58,49,39,.45);
  background:rgba(255,251,240,.6);color:var(--ink);transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.btn:hover{background:#fffaf0;border-color:var(--ink)}
.btn:focus-visible,[tabindex]:focus-visible,.spk:focus-visible,.opt:focus-visible{outline:2px solid var(--teal-deep);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--title);color:var(--parch);border-color:var(--title)}
.btn svg{width:17px;height:17px;flex:none}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{border-color:rgba(58,49,39,.35)}
.btn.primary{background:var(--title);color:var(--parch);border-color:var(--title)}
.btn.primary:hover{background:#1f3834}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{font-size:11px;padding:4px 8px}
.linkish{background:none;border:0;padding:2px 0;cursor:pointer;font-style:italic;color:var(--teal-deep);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.linkish:hover{color:var(--title)}
#walked{display:flex;gap:4px;align-items:center;padding:4px 0 4px 10px;border-left:1px solid var(--ink-faint);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0}
#walked i{width:17px;height:17px;border-radius:50%;border:1.3px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--caps);font-size:9.5px;font-weight:700;color:var(--ink-3)}
#walked i.on{background:var(--teal);border-color:var(--teal-deep);color:#fff}
#walked i.next{border-color:var(--ochre-deep);color:var(--ochre-deep);box-shadow:0 0 0 2px rgba(207,159,58,.35)}
#walked span{font-size:12px;font-style:italic;color:var(--ink-2);margin-left:5px;white-space:nowrap}
.menuBtn{display:none}
.menu{position:absolute;z-index:26;display:none;flex-direction:column;gap:4px;padding:10px;min-width:250px}
.menu.show{display:flex}
.menu button{text-align:left;justify-content:flex-start}

/* ---------- stage + map ---------- */
#stage{position:relative;height:calc(100% - var(--bar-h));overflow:hidden;touch-action:none}
#map{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#stage.panning #map{cursor:grabbing}
#stage.lens-free #map{cursor:none}
#stage.lens-free.touch #map{cursor:default}

/* svg type */
.t-title{font-family:var(--caps);font-weight:700;letter-spacing:.09em;fill:var(--ink);font-size:15px}
.t-wall{font-size:11.5px;fill:var(--title)}
.t-pic{font-family:var(--serif);font-style:italic;fill:var(--ink-2);font-size:11.5px}
.t-sub{font-family:var(--caps);font-weight:600;letter-spacing:.14em;fill:var(--rust);font-size:9.5px}
.t-small{font-family:var(--serif);font-style:italic;fill:var(--ink-2);font-size:11px}
.t-vname{font-family:var(--caps);font-weight:600;letter-spacing:.06em;fill:var(--ink);font-size:10.5px}
.t-lake{fill:var(--title)}
.halo{paint-order:stroke;stroke:var(--parch);stroke-width:4px;stroke-linejoin:round}
.halo-w{paint-order:stroke;stroke:rgba(220,236,230,.85);stroke-width:4px;stroke-linejoin:round}
.lt{font-family:var(--serif);font-style:italic;fill:var(--ink);font-size:6.2px}
.lt-b{font-family:var(--caps);font-weight:700;fill:var(--ink);font-size:6px;letter-spacing:.06em}
.lt-r{font-family:var(--caps);font-weight:600;fill:var(--rust);font-size:5.2px;letter-spacing:.08em}

.title-hit{cursor:pointer}
.title-hit:hover .t-title,.title-hit:focus .t-title,.title-hit.active .t-title{fill:var(--teal-deep)}
.title-hit .ul{stroke:var(--teal-deep);stroke-width:1.2;opacity:0;transition:opacity .2s}
.title-hit:hover .ul,.title-hit:focus .ul,.title-hit.active .ul{opacity:.7}
.title-hit:focus{outline:none}
.village{cursor:pointer}
.villager{cursor:pointer}
.villager .vring{fill:none;stroke:var(--ochre);stroke-width:1.3;opacity:0;transition:opacity .2s}
.villager:hover .vring,.villager:focus .vring{opacity:1}
.home.offstage{display:none}

/* water */
.w-edge{fill:none;stroke:var(--teal-deep);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.w-body{fill:none;stroke:var(--teal);stroke-linecap:round;stroke-linejoin:round}
.w-cur{fill:none;stroke:#d7ece6;stroke-linecap:round;stroke-dasharray:2 16;opacity:.75;animation:flow 1.6s linear infinite}
.fund .w-edge{stroke:#244c43}.fund .w-body{stroke:var(--fundw)}.fund .w-cur{stroke:#bcd7cd}
.canal .w-edge{stroke:#5d554a;stroke-linecap:butt;opacity:.9}.canal .w-body{stroke:var(--canal);stroke-linecap:butt}.canal .w-cur{stroke:#eef7f4;stroke-dasharray:3 12}
.mill .w-edge{stroke:var(--mill-deep)}.mill .w-body{stroke:var(--mill)}.mill .w-cur{stroke:#e3f1f4;stroke-dasharray:3 10;animation-duration:1.1s}
.gline .w-edge{stroke:var(--line-deep)}.gline .w-body{stroke:var(--line)}.gline .w-cur{stroke:#fff3c8}
.aqueduct .w-cur{stroke:#fff3c8;stroke-width:1;stroke-dasharray:2 9}
.flow-el .w-edge,.flow-el .w-body,.flow-el .w-cur{transition:stroke-width .9s ease, opacity .6s}
.flow-el{transition:opacity .7s}
.flow-el.off{opacity:0;pointer-events:none}
.road{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.75}
.road.faint{opacity:.35}
.road.path{stroke:var(--ink-2);stroke-width:1.5}
.road.connector{stroke:#7a5f44;stroke-width:1.9;stroke-dasharray:5 4;opacity:.8}
.road.coin{stroke:var(--gold);stroke-width:1.8;stroke-dasharray:1.5 6}
.road.harvest{stroke:var(--ochre);stroke-width:2.6;stroke-dasharray:6 5;opacity:.9}
.road.backers{stroke:var(--slate);stroke-dasharray:1 6;stroke-width:2.2}
.road.care{stroke:var(--care);stroke-width:2;stroke-dasharray:2 4}
.road.thread{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:1 4;opacity:.8}
.road-g{transition:opacity .8s}
.road-g.off{opacity:0;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes shimmer{0%,100%{opacity:.15}50%{opacity:.6}}
.shimmer{animation:shimmer 3.4s ease-in-out infinite}
@keyframes rain{0%{transform:translateY(-10px);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translateY(46px);opacity:0}}
.rain line{stroke:var(--teal);stroke-width:1.1;stroke-linecap:round;animation:rain 1.3s linear infinite}
@keyframes tokenfall{0%{transform:translate(0,-6px);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(-30px,70px);opacity:0}}
.tokenrain>g{animation:tokenfall 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}
.gear{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.0}20%{opacity:.5}100%{transform:translate(8px,-34px) scale(1.6);opacity:0}}
.smoke circle{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bubble{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.25);opacity:.9}}
.bubble{animation:bubble 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes grow{0%,100%{transform:scaleY(.75)}50%{transform:scaleY(1.08)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes birdfly{0%{transform:translate(0,0)}25%{transform:translate(14px,-5px)}50%{transform:translate(26px,2px)}75%{transform:translate(12px,6px)}100%{transform:translate(0,0)}}
.bird{animation:birdfly 9s ease-in-out infinite}
.wake{opacity:0;transition:opacity 1.6s;pointer-events:none}
.wake.awake{opacity:1;pointer-events:auto}
@keyframes rattle{0%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}60%{transform:translateY(2px)}}
.hand-on .cboard{animation:rattle 1.1s ease-in-out 3}
.actor{pointer-events:none}
.say-bub{transition:opacity .3s}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
.say-bub circle{animation:dots 1.2s ease-in-out infinite}
.say-bub circle:nth-child(3){animation-delay:.2s}.say-bub circle:nth-child(4){animation-delay:.4s}

/* the cast's movement */
.char .ch-body{transform-box:view-box}
.pose-idle>g>.ch-body,.pose-idle>.ch-body{animation:breathe 3.2s ease-in-out infinite;transform-origin:0px 0px}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
.pose-walk .leg-l{animation:stepA .5s ease-in-out infinite alternate}
.pose-walk .leg-r{animation:stepB .5s ease-in-out infinite alternate}
.pose-walk .arm-l{animation:stepB .5s ease-in-out infinite alternate}
.pose-walk .arm-r{animation:stepA .5s ease-in-out infinite alternate}
.pose-walk>g>.ch-body{animation:walkbob .25s ease-in-out infinite alternate}
@keyframes stepA{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes stepB{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-1.4px)}}
.pose-act .arm-r{animation:act 1.3s ease-in-out infinite}
.pose-act .head{animation:nod 1.3s ease-in-out infinite}
.pose-act .rod{animation:rod 2.4s ease-in-out infinite}
@keyframes act{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-110deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes rod{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.2}50%{opacity:.9}}
.traveller-face{transition:opacity 1.2s}

/* highlight pulses */
.hl-ring{fill:none;stroke:var(--gold);stroke-width:3;opacity:0}
.hl-on .hl-ring,.hl-on>.hl-ring{animation:hlr 1.6s ease-out 3}
@keyframes hlr{0%{opacity:0;stroke-width:8}30%{opacity:.95}100%{opacity:0;stroke-width:2}}
.pulse-path{fill:none;stroke:var(--gold);stroke-linecap:round;opacity:0;pointer-events:none}
.pulse-path.go{animation:pp 1.5s ease-out 3}
@keyframes pp{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}

/* lens-only animated details */
@keyframes lfill{0%{transform:scaleY(.05)}70%{transform:scaleY(1)}100%{transform:scaleY(1)}}
@keyframes lrise{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
@keyframes lhand{0%{transform:translate(0,0)}45%{transform:translate(12px,0)}55%{transform:translate(12px,0)}100%{transform:translate(0,0)}}
@keyframes lseq{0%,8%{opacity:0}14%,92%{opacity:1}100%{opacity:0}}
@keyframes lripple{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.6);opacity:0}}

/* ---------- lens ---------- */
#lens{position:absolute;z-index:8;left:0;top:0;width:280px;height:280px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 3px #6b5a3c, 0 0 0 6px #c9a75f, 0 0 0 7.5px #6b5a3c, 0 14px 30px rgba(40,30,15,.4);
  overflow:hidden;background:var(--parch);will-change:transform;display:none}
#lens.show{display:block}
#lens svg{position:absolute;inset:0;width:100%;height:100%}
#lens::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35),rgba(255,255,255,0) 38%),radial-gradient(circle,rgba(0,0,0,0) 70%,rgba(60,40,10,.18) 100%);pointer-events:none}
#lensHandle{position:absolute;z-index:7;width:18px;height:92px;border-radius:9px;pointer-events:none;display:none;
  background:linear-gradient(90deg,#4a3a24,#7a5f38 45%,#3b2e1c);box-shadow:0 6px 14px rgba(40,30,15,.35);transform-origin:50% 0}
#lensHandle.show{display:block}
#lensCaption{position:absolute;z-index:9;pointer-events:none;display:none;max-width:260px;text-align:center;
  font-style:italic;font-size:14px;color:var(--ink);background:rgba(243,234,213,.94);border:1px solid var(--ink-faint);
  padding:4px 10px;border-radius:3px;box-shadow:0 2px 6px rgba(58,49,39,.15)}
#lensCaption b{font-family:var(--caps);font-style:normal;font-size:11.5px;letter-spacing:.08em;display:block;color:var(--title)}
#lensCaption.show{display:block}

/* ---------- floating controls ---------- */
#zoomCtl{position:absolute;z-index:6;right:14px;top:14px;display:flex;flex-direction:column;gap:5px}
#zoomCtl .btn{width:36px;height:36px;justify-content:center;padding:0;font-size:18px}
#hint{position:absolute;z-index:16;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(243,234,213,.96);border:1px solid var(--ink-faint);border-radius:3px;padding:6px 14px;
  font-style:italic;font-size:14.5px;color:var(--ink-2);box-shadow:0 2px 8px rgba(58,49,39,.12);transition:opacity .5s;pointer-events:none;
  max-width:calc(100% - 120px);text-align:center}
#hint.gone{opacity:0}
#returnPill{position:absolute;z-index:16;left:14px;top:14px;display:none;box-shadow:var(--shadow)}
#returnPill.show{display:inline-flex}

/* ---------- speaker buttons ---------- */
.spk{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(58,49,39,.45);background:rgba(255,251,240,.75);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--title);vertical-align:middle;transition:background .15s}
.spk:hover{background:#fffaf0;border-color:var(--ink)}
.spk svg{width:17px;height:17px}
.spk .w1,.spk .w2{opacity:.35}
.spk.playing{background:var(--title);color:var(--parch);border-color:var(--title)}
.spk.playing .w1{animation:wave 1s ease-in-out infinite}
.spk.playing .w2{animation:wave 1s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.spk.sm{width:24px;height:24px}.spk.sm svg{width:14px;height:14px}
.speaking{background:rgba(207,159,58,.24);box-shadow:0 0 0 3px rgba(207,159,58,.24);border-radius:2px;transition:background .3s}

/* ---------- cards / drawers ---------- */
.card{background:var(--parch);border:1px solid rgba(58,49,39,.5);border-radius:3px;box-shadow:var(--shadow);position:relative}
.card::before{content:"";position:absolute;inset:4px;border:1px solid var(--ink-faint);border-radius:2px;pointer-events:none}
.card h2,.card h3{font-family:var(--caps);color:var(--title);margin:0;letter-spacing:.06em}
.card .sub{font-family:var(--caps);color:var(--rust);font-size:11px;letter-spacing:.14em;font-weight:600;margin-top:1px}
.x{position:absolute;right:8px;top:6px;border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-2);padding:4px 7px;z-index:2}
.x:hover{color:var(--ink)}
.hrow{display:flex;align-items:flex-start;gap:9px;padding-right:26px}
.hrow>div{flex:1;min-width:0}

#panel{position:absolute;z-index:12;width:350px;max-width:calc(100% - 24px);padding:16px 18px 14px;display:none;max-height:calc(100% - 24px);overflow:auto}
#panel.show{display:block}
#panel.wide{width:470px}
#panel h2{font-size:18px}
#panel .sub{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--ink-2);font-weight:400}
#panel .body{font-size:16.5px;margin:8px 0 6px;color:var(--ink)}
#panel ul{margin:8px 0 2px;padding:0;list-style:none;border-top:1px solid var(--ink-faint)}
#panel li{font-size:14.5px;padding:4px 0 3px;border-bottom:1px dotted rgba(58,49,39,.2);display:flex;gap:7px}
#panel li::before{content:"·";color:var(--ochre-deep);font-weight:700}
.vtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.vtable th{font-family:var(--caps);font-size:9.5px;letter-spacing:.06em;text-align:right;font-weight:600;color:var(--ink-2);padding:2px 3px;border-bottom:1px solid var(--ink-faint);vertical-align:bottom}
.vtable th:first-child,.vtable td:first-child{text-align:left}
.vtable td{text-align:right;padding:3px 3px;border-bottom:1px dotted rgba(58,49,39,.18);font-variant-numeric:tabular-nums}
#panel .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lensline{font-size:13.5px;color:var(--ink-3);margin-top:8px;font-style:italic}

.drawer{position:absolute;z-index:14;top:12px;bottom:12px;width:370px;max-width:calc(100% - 24px);padding:18px 18px 14px;overflow:auto;display:none}
.drawer.show{display:block}
#dials{right:12px}
#legend{left:12px;width:340px}
.drawer h2{font-size:17px}
.drawer .lede{font-style:italic;font-size:14.5px;color:var(--ink-2);margin:6px 0 10px}
.drawer h4{font-family:var(--caps);font-size:12px;letter-spacing:.1em;color:var(--rust);margin:14px 0 4px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dial{padding:9px 0 10px;border-top:1px solid var(--ink-faint)}
.dial .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dial .lab b{font-family:var(--caps);font-size:12px;letter-spacing:.06em;font-weight:600}
.dial .lab output{font-variant-numeric:tabular-nums;font-weight:600;color:var(--teal-deep);font-size:14.5px;text-align:right}
.dial .nt{font-size:13px;font-style:italic;color:var(--ink-3);margin-top:2px}
.seg{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;cursor:pointer;padding:5px 6px;border:1px solid rgba(58,49,39,.4);background:rgba(255,251,240,.6);border-radius:2px;font-family:var(--caps);font-size:11.5px;letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
input[type=range]{width:100%;accent-color:var(--teal-deep);margin-top:6px}
.fixedlist{margin:4px 0;padding-left:18px;font-size:14px}
.fixedlist li{margin:3px 0}
.example{margin:10px 0 4px;padding:10px 12px;background:rgba(255,251,240,.65);border:1px solid var(--ink-faint);border-radius:2px}
.example .big{font-family:var(--caps);font-size:13.5px;color:var(--title);letter-spacing:.04em;margin-bottom:3px}
.example .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dotted rgba(58,49,39,.2);padding:2px 0}
.example .row:last-child{border-bottom:0}
.leg-row{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted rgba(58,49,39,.18);font-size:14.5px}
.leg-row svg{flex:none;width:44px;height:24px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--teal-deep)}

/* ---------- chapter bar ---------- */
#cbar{position:absolute;z-index:15;left:50%;bottom:14px;transform:translateX(-50%);width:min(940px,calc(100% - 24px));padding:12px 16px 10px;display:none;max-height:56%;overflow:auto}
#cbar.show{display:block}
#cbar .top{display:flex;align-items:center;gap:10px}
#cbar .ttl{flex:1;min-width:0}
#cbar .ttl h3{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cbar .ttl .sub{font-size:10px}
#cbar .castrow{display:flex;gap:2px;flex:none}
#cbar .castrow svg{width:30px;height:30px;border-radius:50%;background:rgba(255,251,240,.8);border:1px solid var(--ink-faint)}
#cbar .ctl{display:flex;gap:4px;flex:none}
#cbar .ctl .btn{padding:5px 8px}
#cbar .hud{font-size:13.5px;font-style:italic;color:var(--ink-2);white-space:nowrap}
.caprow{display:flex;gap:10px;align-items:flex-start;margin:8px 2px 2px}
.caption{flex:1;font-size:18.5px;line-height:1.38;font-style:italic;padding:1px 3px}
.lines{display:flex;flex-direction:column;gap:5px;margin:6px 0 2px}
.line{display:flex;gap:9px;align-items:center;opacity:.32;transition:opacity .4s}
.line.show{opacity:1}
.line .por{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,251,240,.85);border:1px solid rgba(58,49,39,.3);overflow:hidden;display:flex;align-items:center;justify-content:center}
.line .por svg{width:42px;height:42px}
.line .said{flex:1;min-width:0;background:rgba(255,251,240,.8);border:1px solid rgba(58,49,39,.28);border-radius:12px 12px 12px 3px;padding:5px 11px;font-size:16.5px}
.line .said b{font-family:var(--caps);font-size:10.5px;letter-spacing:.08em;color:var(--rust);display:block;font-weight:600}
#cbar .fork{margin:8px 0 2px}
#cbar .fork .q{display:flex;gap:10px;align-items:flex-start;font-size:17.5px;color:var(--ink);margin-bottom:8px}
#cbar .fork .q span{flex:1;padding:1px 3px}
#cbar .fork .q span::before{content:"A choice · ";font-family:var(--caps);font-size:11px;letter-spacing:.1em;color:var(--rust);font-weight:700}
#cbar .opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{flex:1 1 220px;text-align:left;cursor:pointer;padding:8px 11px;border:1px solid rgba(58,49,39,.5);background:rgba(255,251,240,.75);border-radius:3px;transition:background .15s,border-color .15s}
.opt:hover{background:#fff;border-color:var(--teal-deep)}
.opt b{display:block;font-family:var(--serif);font-weight:600;font-size:16px}
.opt span{display:block;font-style:italic;font-size:13.5px;color:var(--ink-2)}
.opt.prev{border-color:var(--teal-deep);box-shadow:inset 0 0 0 1px var(--teal-deep)}
.opt.prev::after{content:"your choice last time";display:block;font-size:11.5px;color:var(--teal-deep);font-style:italic;margin-top:2px}
#cbar .prog{display:flex;gap:4px;align-items:center;margin-top:8px}
#cbar .prog i{height:3px;flex:1;background:var(--ink-faint);border-radius:2px}
#cbar .prog i.on{background:var(--teal)}
#cbar .prog i.fk{background:var(--ochre);height:5px}
#cbar .prog i.fk.on{background:var(--ochre-deep)}
#cbar .endacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
#cbar .endnote{width:100%;display:flex;gap:10px;align-items:center;font-size:16px;font-style:italic;color:var(--ink-2)}

/* ---------- time bar ---------- */
#timebar{position:absolute;z-index:13;left:50%;bottom:14px;transform:translateX(-50%);width:min(940px,calc(100% - 24px));padding:9px 14px 8px;display:none}
#timebar.show{display:block}
#timebar .tb-row{display:flex;align-items:center;gap:9px}
#timebar .tb-slider{flex:1;position:relative;min-width:120px}
#timebar input[type=range]{margin:0;display:block}
#timebar .ticks{position:relative;height:25px;margin:0 7px}
#timebar .ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--teal-deep);white-space:nowrap;font-style:italic}
#timebar .tlabel{font-family:var(--caps);font-size:12px;letter-spacing:.06em;color:var(--title);min-width:92px;text-align:right;font-weight:600}
#timebar .tb-text{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-style:italic;color:var(--ink-2);margin-top:4px}
#timebar .tb-text span{flex:1;padding:1px 3px}
#timebar .chips{display:none;flex-wrap:wrap;gap:5px;margin-top:6px}
#timebar .chips.show{display:flex}
.chip{cursor:pointer;border:1px solid rgba(58,49,39,.4);background:rgba(255,251,240,.65);border-radius:14px;padding:3px 11px;font-size:13.5px;font-family:var(--serif)}
.chip:hover{background:#fff}
.chip[aria-pressed="true"]{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.chip .n{font-family:var(--caps);font-size:10px;margin-right:5px;opacity:.75}
#timebar .tb-note{font-size:12px;color:var(--ink-3);font-style:italic;margin-top:3px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(58,49,39,.35);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.overlay>.card{width:min(980px,100%);max-height:calc(100% - 16px);overflow:auto;padding:22px 24px 18px}
.overlay h2{font-size:22px}
.overlay .lede{font-style:italic;color:var(--ink-2);margin:4px 0 14px;font-size:16px}
.chooser-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:14px;font-style:italic;color:var(--ink-3)}

/* welcome */
#welcome{background:rgba(58,49,39,.42)}
#welcome>.card{width:min(900px,100%);padding:20px 26px 16px}
.wbrand{text-align:center;margin-bottom:6px}
.wbrand h1{font-family:var(--caps);font-weight:700;color:var(--title);font-size:clamp(22px,3.4vw,34px);letter-spacing:.07em;margin:0}
.wbrand p{margin:0;font-style:italic;color:var(--ink-2);font-size:15px}
.wbody{display:flex;gap:22px;align-items:center;min-height:300px;padding:10px 0}
.wart{flex:0 0 38%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.wart svg{max-height:260px}
.wtext{flex:1;min-width:0}
.wstep{font-family:var(--caps);font-size:11px;letter-spacing:.14em;color:var(--rust);font-weight:700}
.wtext h2{font-size:24px;margin:2px 0 8px}
.wsay{display:flex;gap:10px;align-items:flex-start}
.wsay p{flex:1;margin:0;font-size:20px;line-height:1.42;padding:1px 3px}
.wacts{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px}
.wacts .btn.primary{font-size:15px;padding:11px 18px}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--ink-faint);padding-top:10px;flex-wrap:wrap}
.wdots{display:flex;gap:7px}
.wdots button{width:11px;height:11px;border-radius:50%;border:1.3px solid var(--ink-3);background:none;padding:0;cursor:pointer}
.wdots button[aria-current="true"]{background:var(--teal);border-color:var(--teal-deep)}
.troupe{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px;max-height:360px;overflow:auto;padding:2px}
.tcard{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:7px 8px;border:1px solid rgba(58,49,39,.3);border-radius:3px;background:rgba(255,251,240,.6);cursor:pointer;transition:background .15s}
.tcard:hover{background:#fffaf0}
.tcard svg.portrait{flex:none;width:44px;height:52px}
.tcard b{display:block;font-family:var(--caps);font-size:12px;letter-spacing:.05em;color:var(--title)}
.tcard .r{display:block;font-family:var(--caps);font-size:9px;letter-spacing:.1em;color:var(--rust);font-weight:600}
.tcard .p{display:block;font-style:italic;font-size:12.5px;color:var(--ink-2);line-height:1.2}
.wbody.troupe-mode{display:block;min-height:0}
.wbody.troupe-mode .wart{display:none}

/* chapters */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.chcard{display:flex;flex-direction:column;gap:6px;padding:12px 13px;border:1px solid rgba(58,49,39,.4);background:rgba(255,251,240,.6);border-radius:3px;position:relative}
.chcard.done{border-color:var(--teal-deep)}
.chcard.locked{opacity:.62}
.chcard .num{font-family:var(--caps);font-size:11px;letter-spacing:.14em;color:var(--rust);font-weight:700}
.chcard h3{font-size:15.5px;line-height:1.2}
.chcard .c{font-style:italic;font-size:14.5px;color:var(--ink-2);line-height:1.3;flex:1}
.chcard .castrow{display:flex;gap:2px}
.chcard .castrow svg{width:34px;height:40px}
.chcard .st{font-size:13px;font-style:italic;color:var(--teal-deep)}
.chcard.locked .st{color:var(--ink-3)}
.chcard .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#listView ol{padding-left:22px;margin:8px 0}
#listView li{margin:6px 0;font-size:16.5px}
#listView li .who{font-family:var(--caps);font-size:11px;letter-spacing:.08em;color:var(--rust)}
#listView li.said{list-style:none;margin-left:14px;font-style:normal}
#listView .lf{margin:4px 0 4px 6px;padding:6px 10px;border-left:3px solid var(--ochre);background:rgba(255,251,240,.6)}
#listView .lf b{font-family:var(--caps);font-size:12px;letter-spacing:.06em;color:var(--rust)}
#listView .lf ul{margin:4px 0;padding-left:18px}
#listView h3{margin-top:16px}

/* pop-outs */
#pop>.card{width:min(760px,100%)}
.pophead{display:flex;gap:10px;align-items:flex-start;padding-right:28px}
.pophead h2{flex:1}
.pop-intro{font-size:17px;margin:8px 0 12px;padding:1px 3px}
.ways{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.way{padding:10px 11px;border:1px solid rgba(58,49,39,.35);border-radius:3px;background:rgba(255,251,240,.65)}
.way .wh{display:flex;align-items:center;gap:7px;font-family:var(--caps);font-size:12.5px;letter-spacing:.05em;color:var(--title);font-weight:600}
.way .wh svg{width:30px;height:30px;flex:none}
.way p{margin:5px 0 0;font-size:15px;padding:1px 3px}
.banner{font-family:var(--caps);letter-spacing:.06em;font-size:15px;color:#fff6dd;background:#7a5636;border:1px solid #4a3622;border-radius:3px;padding:8px 12px;text-align:center;margin:8px 0;box-shadow:inset 0 0 0 2px rgba(255,240,200,.18)}
.councilart{display:flex;justify-content:center;margin:2px 0}
.councilart svg{width:220px;height:140px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc section{padding:10px 12px;border:1px solid rgba(58,49,39,.35);border-radius:3px;background:rgba(255,251,240,.65)}
.calc h3{font-size:14px;margin-bottom:4px}
.calc label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;margin:6px 0}
.calc input[type=number]{width:96px;font:inherit;font-size:15px;padding:3px 6px;border:1px solid rgba(58,49,39,.45);border-radius:2px;background:#fffdf6;text-align:right}
.result{margin-top:8px;padding:7px 9px;background:rgba(79,142,144,.12);border-left:3px solid var(--teal);font-size:15.5px;display:flex;gap:8px;align-items:flex-start}
.result span{flex:1;padding:1px 3px}
.capnote{font-size:13.5px;font-style:italic;color:var(--ink-2);margin-top:10px;padding:1px 3px}
.qvgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:300px;margin:8px auto}
.qvgrid i{aspect-ratio:1;border-radius:50%;background:#e9dcbf;border:1px solid #c9b48a}
.qvgrid i.used{background:var(--gold);border-color:var(--teal-deep)}
.exlist{margin:8px 0 0;padding-left:20px;font-size:15px}
.exlist li{margin:3px 0;padding:1px 3px}
#gateInv>.card{width:min(640px,100%);text-align:center}
#gateInv .gtext{font-size:19px;margin:10px 0;padding:1px 3px}
#gateInv .gnote{font-style:italic;color:var(--ink-3);font-size:14.5px}
#gateInv .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

@media (max-width: 1420px){
  #bar nav .btn .lbl{display:none}
  #bar nav .btn.keep .lbl{display:inline}
  #bar nav .btn{padding:7px 9px}
}
@media (max-width: 1180px){
  .brand p{display:none}
  #walked span{display:none}
}
@media (max-width: 760px){
  :root{--bar-h:54px}
  .brand h1{font-size:16px}
  #bar nav{position:absolute;top:var(--bar-h);right:8px;flex-direction:column;align-items:stretch;background:var(--parch);border:1px solid rgba(58,49,39,.4);padding:8px;border-radius:3px;box-shadow:var(--shadow);display:none;z-index:25}
  #bar nav.open{display:flex}
  #bar nav .btn .lbl{display:inline}
  .menuBtn{display:inline-flex;margin-left:auto}
  #walked span{display:none}
  #walked i{width:14px;height:14px;font-size:8px}
  #walked{gap:2px;padding-left:6px}
  #panel{left:16px!important;right:16px;bottom:16px;top:auto!important;width:auto!important;max-height:62%}
  .drawer{left:16px!important;right:16px!important;width:auto;top:auto;max-height:72%}
  #cbar{bottom:10px;padding:9px 11px 8px;width:calc(100% - 32px);max-height:62%}
  .caption{font-size:16px}
  .line .said{font-size:15px}
  .line .por,.line .por svg{width:34px;height:34px}
  #cbar .ctl .btn .lbl{display:none}
  #cbar .ttl h3{white-space:normal;font-size:13px}
  #cbar .ctl .btn{padding:5px 6px}
  #cbar .castrow{display:none}
  #timebar{width:calc(100% - 32px);bottom:10px}
  #timebar .tb-row{flex-wrap:wrap}
  #timebar .tb-slider{order:5;flex-basis:100%}
  #timebar .tb-row{gap:5px}
  #timebar .tlabel{min-width:0;flex:1;text-align:left}
  #timebar .btn.small{padding:4px 6px;font-size:10.5px}
  #timebar .ticks{height:14px}
  #timebar .tb-text{font-size:13.5px}
  .wbody{flex-direction:column;min-height:0}
  .wart{flex:none}
  .wart svg{max-height:150px}
  .wsay p{font-size:17px}
  .calc{grid-template-columns:1fr}
  #zoomCtl{top:10px;right:10px}
  #zoomCtl .btn{width:32px;height:32px}
  #hint{max-width:calc(100% - 80px);font-size:13.5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wake{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">
      <h1 id="brandTitle">The Realm of the NAO</h1>
      <p id="brandSub"></p>
    </div>
    <button class="btn menuBtn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Ways through the realm">
      <button class="btn primary keep" id="btnChapters" aria-label="Chapters" title="The eight chapters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C7 4.5 9.5 4.6 12 6c2.5-1.4 5-1.5 8-.5v13c-3-1-5.5-.9-8 .5-2.5-1.4-5-1.5-8-.5z" stroke-linejoin="round"/><path d="M12 6v13"/></svg><span class="lbl">Chapters</span></button>
      <button class="btn" id="btnLens" aria-label="Lens" aria-pressed="false" title="Magnifying glass (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6" stroke-linecap="round"/></svg><span class="lbl">Lens</span></button>
      <button class="btn" id="btnTools" aria-label="Tools" aria-expanded="false" aria-controls="toolsMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="1.5"/><path d="M8 8h8M8 12.5h2M12 12.5h2M16 12.5h0M8 16.5h2M12 16.5h2" stroke-linecap="round"/></svg><span class="lbl">Tools</span></button>
      <button class="btn" id="btnDials" aria-label="Council dials" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><span class="lbl">Council dials</span></button>
      <button class="btn" id="btnLegend" aria-label="Legend" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="1"/><path d="M8 8.5h8M8 12h8M8 15.5h5" stroke-linecap="round"/></svg><span class="lbl">Legend</span></button>
      <button class="btn" id="btnRead" aria-label="Read aloud" aria-pressed="false" title="Read aloud: the tour and every panel voice themselves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke-linecap="round"/></svg><span class="lbl">Read aloud</span></button>
      <button class="btn quiet" id="btnWander" aria-label="Wander" title="Step out and wander the living map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18c3-1 4-5 7-5s4 3 9 1M6 8.5l3 3M9 8.5l-3 3M16.5 5.5v6M16.5 5.5l3 1.5-3 1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Wander</span></button>
      <button class="btn quiet" id="btnReset" aria-label="Reset the realm" title="Return every choice to the defaults; your walk is kept">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12a7 7 0 1 0 2.1-5" stroke-linecap="round"/><path d="M4.5 3.5v4h4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Reset the realm</span></button>
    </nav>
    <button id="walked" title="Chapters walked: the Gate opens after the eighth" aria-label="Chapters walked"></button>
  </header>
  <div class="card menu" id="toolsMenu" role="menu" aria-label="Tools"></div>

  <main id="stage" aria-label="Map of the realm">
    <svg id="map" role="img" aria-label="Hand-drawn map of the Realm of the NAO" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="lensHandle"></div>
    <div id="lens" aria-hidden="true"><svg id="lensSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="lensCaption" aria-live="polite"></div>
    <div id="zoomCtl">
      <button class="btn" id="zIn" aria-label="Zoom in">+</button>
      <button class="btn" id="zOut" aria-label="Zoom out">−</button>
      <button class="btn" id="zFit" aria-label="Show the whole map" title="Whole map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round"/></svg></button>
    </div>
    <div id="hint" class="gone" role="status"></div>
    <button class="btn primary" id="returnPill"></button>

    <aside id="panel" class="card" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
      <button class="x" id="panelX" aria-label="Close">×</button>
      <div class="hrow"><span id="panelSpk"></span><div><h2 id="panelTitle"></h2><div class="sub" id="panelSub"></div></div></div>
      <div class="body" id="panelBody"></div>
      <div id="panelExtra"></div>
      <div class="lensline" id="panelLens"></div>
      <div class="acts" id="panelActs"></div>
    </aside>

    <aside id="dials" class="card drawer" aria-labelledby="dialsTitle">
      <button class="x" data-close="dials" aria-label="Close">×</button>
      <h2 id="dialsTitle">Council dials</h2>
      <div id="dialsBody"></div>
    </aside>

    <aside id="legend" class="card drawer" aria-labelledby="legendTitle">
      <button class="x" data-close="legend" aria-label="Close">×</button>
      <h2 id="legendTitle">Legend</h2>
      <div id="legendBody"></div>
    </aside>

    <section id="cbar" class="card" aria-live="polite" aria-label="Chapter">
      <div class="top">
        <div class="castrow" id="cCast"></div>
        <div class="ttl"><h3 id="cTitle"></h3><div class="sub" id="cSub"></div></div>
        <div class="hud" id="cHud"></div>
        <div class="ctl">
          <button class="btn" id="cPrev" aria-label="Previous step" title="Previous step (←)">◀</button>
          <button class="btn" id="cPlay" aria-label="Pause" title="Play or pause (space)">❚❚</button>
          <button class="btn" id="cNext" aria-label="Next step" title="Next step (→)">▶</button>
          <button class="btn" id="cOut" aria-label="Step out and wander here" title="Step out into Wander here; return when you like">⤢<span class="lbl"></span></button>
          <button class="btn" id="cList" aria-label="Read the chapter as text" title="Read the whole chapter as text">☰</button>
          <button class="btn" id="cClose" aria-label="Leave the chapter" title="Leave the chapter">✕</button>
        </div>
      </div>
      <div class="caprow" id="cCapRow"></div>
      <div class="lines" id="cLines"></div>
      <div class="fork" id="cFork"></div>
      <div class="endacts" id="cEnd"></div>
      <div class="prog" id="cProg"></div>
    </section>

    <section id="timebar" class="card" aria-label="Time and possible futures">
      <div class="tb-row">
        <button class="btn" id="tPlay" aria-label="Play the months" title="Play the months">▶</button>
        <div class="tb-slider"><input type="range" id="tMonth" min="0" max="48" step="1" value="0" aria-label="Month"><div class="ticks" id="tTicks"></div></div>
        <output class="tlabel" id="tLabel">Today</output>
        <button class="btn quiet small" id="tRound" aria-pressed="false">The round</button>
        <button class="btn quiet small" id="tFutures" aria-pressed="false">Possible futures</button>
      </div>
      <div class="tb-text" id="tText"></div>
      <div class="chips" id="tChipsRound"></div>
      <div class="chips" id="tChipsFutures"></div>
    </section>
  </main>

  <div class="overlay" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <div class="card">
      <div class="wbrand"><h1 id="wBrand"></h1><p id="wBrandSub"></p></div>
      <div class="wbody" id="wBody">
        <div class="wart" id="wArt"></div>
        <div class="wtext">
          <div class="wstep" id="wStep"></div>
          <h2 id="wTitle"></h2>
          <div class="wsay"><span id="wSpk"></span><p id="wText"></p></div>
          <div id="wTroupe"></div>
          <div class="wacts" id="wActs"></div>
        </div>
      </div>
      <div class="wfoot">
        <button class="btn quiet" id="wBack">◀ Back</button>
        <div class="wdots" id="wDots"></div>
        <label class="check" style="margin:0"><input type="checkbox" id="wRead"> Read aloud</label>
        <button class="btn" id="wNext">Next ▶</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="chapters" role="dialog" aria-modal="true" aria-labelledby="chTitle">
    <div class="card">
      <button class="x" data-close="chapters" aria-label="Close">×</button>
      <h2 id="chTitle">The eight chapters</h2>
      <div class="lede" id="chLede"></div>
      <div class="chgrid" id="chGrid"></div>
      <div class="chooser-foot"><span id="chFoot"></span><span><button class="btn quiet" id="chAllText">Every chapter as text</button> <button class="btn quiet" id="forgetWalk">Forget my walk</button></span></div>
    </div>
  </div>

  <div class="overlay" id="listView" role="dialog" aria-modal="true" aria-labelledby="listTitle">
    <div class="card">
      <button class="x" data-close="listView" aria-label="Close">×</button>
      <h2 id="listTitle"></h2>
      <div class="lede" id="listLede"></div>
      <div id="listBody"></div>
    </div>
  </div>

  <div class="overlay" id="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <div class="card">
      <button class="x" data-close="pop" aria-label="Close">×</button>
      <div id="popBody"></div>
    </div>
  </div>

  <div class="overlay" id="gateInv" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="card">
      <button class="x" data-close="gateInv" aria-label="Close">×</button>
      <div id="gBody"></div>
    </div>
  </div>
</div>
<script>
/* ======================================================================

function drawForests(w, rnd) {
  const g = w.ly.terrain, keep = [];
  Object.values(PATHS).forEach(d => { const s = sample(d, 10); s.pts.forEach(p => keep.push([p[0], p[1], 15])); });
  HIVES.forEach(v => keep.push([v.at[0], v.at[1] + 10, 50]));
  R.regions.forEach(r => keep.push([r.label[0], r.label[1] - 4, 64]));
  [[800, 342, 175], [300, 342, 140], [505, 290, 70], [800, 480, 72], [662, 520, 50], [800, 416, 40], [205, 712, 34], [70, 408, 26], [150, 425, 22], [232, 402, 26], [1128, 262, 34], [1032, 912, 80], [1290, 60, 60], [860, 600, 260], [1420, 880, 110], [160, 925, 140], [110, 575, 110], [1300, 470, 50], [858, 962, 40], [565, 995, 90]].forEach(k => keep.push(k));
  const ok = (x, y) => keep.every(k => Math.hypot(x - k[0], y - k[1]) > k[2]);
  const clusters = [[480, 420, 40], [1080, 450, 40], [1240, 380, 40], [1500, 520, 60], [1520, 700, 40], [430, 970, 30], [930, 975, 30], [1220, 960, 40], [1180, 300, 30], [380, 480, 30], [1460, 380, 40], [1290, 650, 35], [40, 760, 30], [320, 610, 30], [1540, 300, 30], [1180, 860, 30], [1380, 560, 30]];
  const trees = [];
  clusters.forEach(c => { const n = Math.round(c[2] / 4); for (let i = 0; i < n; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * c[2]; const x = c[0] + Math.cos(a) * r, y = c[1] + Math.sin(a) * r * 0.7; if (x < 20 || x > W - 20 || y > 1000 || y < 90) continue; if (ok(x, y)) trees.push([x, y, rnd() < 0.6 ? 's-tree' : 's-pine']); } });
  trees.sort((a, b) => a[1] - b[1]).forEach(t => use(t[2], t[0], t[1], g));
}

});

$('#nav').addEventListener('click', e => { if (e.target.closest('button') && window.innerWidth <= 760 && e.target.closest('button').id !== 'btnTools') { $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); } });

/* ======================================================================
   THE COMPLETION HOOK (for the invite-only website)
   ====================================================================== */
const hooks = [];
function fireHooks() { const c = window.RealmOfNAO.completed(); hooks.forEach(f => { try { f(c); } catch (e) { } }); }
window.RealmOfNAO = {
  version: R.meta.build,
  completed: () => CHAPTERS.filter(c => state.completed[c.id]).map(c => c.id),
  gateOpen: () => !!state.completed.ch8,
  choices: () => Object.assign({}, state.choices),
  onChange: f => hooks.push(f),
  setCompleted: ids => { for (const k in state.completed) delete state.completed[k]; (ids || []).forEach(id => { if (CHID[id]) state.completed[id] = true; }); X.setWalked(walkedN()); save(); applyModel(); renderWalked(); }
};

/* ======================================================================
   script.json: every readable item, its id, speaker and voice
   ====================================================================== */
function voiceFor(sp) {
  const c = CAST[sp], v = (c && c.voice) || {};
  if (v.tool === 'design_voice') return { tool: 'speak', voice: v.save_as };
  if (v.tool === 'speak') return Object.assign({ tool: 'speak', voice: v.voice }, v.style ? { style: v.style } : {});
  return { tool: 'none' };
}
function collectScript() {
  const out = [], ids = new Set();
  const add = (it, where) => {
    if (ids.has(it.id)) throw new Error('duplicate id ' + it.id);
    ids.add(it.id);
    const sp = spoken(it.defaultText);
    const row = { id: it.id, speaker: it.speaker, name: CAST[it.speaker] ? CAST[it.speaker].name : it.speaker, voice: voiceFor(it.speaker), text: it.defaultText };
    if (sp !== it.defaultText) row.spoken = sp;
    row.audio = R.config.audioPath + it.id + R.config.audioExt;
    row.where = where;
    if (it.dyn) row.dynamic = true;
    out.push(row);
  };
  R.welcome.forEach((w, i) => add(welcomeItem(i), `Welcome, page ${i + 1}: ${w.title}`));
  R.cast.forEach(c => castItems(c).forEach(it => add(it, `Welcome, page 3: the cast, ${c.name}`)));
  CHAPTERS.forEach(ch => {
    add(cardItem(ch), `Chapter ${ch.n}: card`);
    const walk = (beats, prefix, label) => beats.forEach(b => {
      const t = { b, path: prefix ? prefix + '-' + b.id : b.id };
      if (b.fork) {
        add(forkItem(ch, t), `Chapter ${ch.n}, ${label}${b.id}: the choice`);
        b.fork.options.forEach(o => walk(o.beats || [], t.path + '-' + o.id, `${label}${b.id}, if "${o.label}", `));
        return;
      }
      beatItems(ch, t).forEach(it => add(it, `Chapter ${ch.n}, ${label}${b.id}: ${it.kind === 'caption' ? 'caption' : 'line'}`));
    });
    walk(ch.beats, '', 'step ');
    add(doneItem(ch), `Chapter ${ch.n}: end`);
  });
  R.regions.forEach(r => regionItems(r).forEach(it => add(it, `Panel: ${r.title}`)));
  HIVES.forEach(v => {
    const its = [mk('panel-hive-' + v.id, 'narrator', () => v.name + '. ' + v.text), mk('panel-hive-' + v.id + '-numbers', 'narrator', c => sentences(hiveNumbers(v, c)), true)];
    if (v.site) its.splice(1, 0, mk('panel-hive-' + v.id + '-site', 'narrator', () => v.name + '. ' + v.site));
    its.forEach(it => add(it, `Panel: ${v.name}`));
  });
  ['funds', 'council', 'pp', 'qv'].forEach(k => popItems(k).forEach(it => add(it, `Pop-out: ${R.popouts[k].title}`)));
  dialsItems().forEach(it => add(it, 'Council dials'));
  legendItems().forEach(it => add(it, 'Legend'));
  add(mk(R.timeText.id, 'narrator', () => R.timeText.text), 'Time scrubber');
  add(mk('time-now', 'narrator', c => { const m = state.month; state.month = 12; const tx = timeNowText(X.compute(Object.assign({}, P0), { choices: {}, flags: {}, month: 12, visited: {}, completed: {}, tour: null })); state.month = m; return tx; }, true), 'Time scrubber (an example month; spoken by the browser when it changes)');
  R.round.stages.forEach(s => add(roundItem(s), 'The round: ' + s.name));
  add(mk(R.futuresIntro.id, 'narrator', () => R.futuresIntro.text), 'Possible futures');
  R.futures.forEach(f => add(futureItem(f), 'Possible future: ' + f.name));
  add(gateItem(), 'The Gate invitation');
  const voices = R.cast.filter(c => c.voice && c.voice.tool !== 'none').map(c => {
    const v = Object.assign({}, c.voice), row = { speaker: c.id, name: c.name, role: c.role, tool: v.tool };
    if (v.voice) row.voice = v.voice; if (v.style) row.style = v.style; if (v.description) row.description = v.description; if (v.save_as) row.save_as = v.save_as;
    row.test_item = c.id === 'narrator' ? 'welcome-1' : 'cast-' + c.id + '-says';
    row.items = out.filter(o => o.speaker === c.id).length;
    return row;
  });
  return {
    title: R.meta.title + ': the script', build: R.meta.build, generated: new Date().toISOString().slice(0, 10),
    how: 'One clip per item. Record "spoken" where it is given, otherwise "text", with the item\'s voice, and save it as <id>.wav; convert to mono mp3 at about 64 kbps and place it at the item\'s "audio" path beside the HTML. Designed voices: first call design_voice with the description and save_as the name on the voice\'s test item, then use speak with that name for every item. Items marked dynamic change with the visitor\'s choices: their clip is used only while the words match the text here, and the browser\'s voice reads them otherwise.',
    voices, count: out.length, items: out
  };
}

/* ======================================================================
   THE FRAME LOOP AND START
   ====================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const k = reduceMotion ? 1 : 1 - Math.exp(-dt * 4.2);
  cam.cx = lerp(cam.cx, camT.cx, k); cam.cy = lerp(cam.cy, camT.cy, k); cam.u = Math.exp(lerp(Math.log(cam.u), Math.log(camT.u), k));
  applyCam();
  if (!reduceMotion) tickMovers(dt);
  renderLens(dt);
  requestAnimationFrame(frame);
}
resize();
buildLegend(); buildRoundChips(); renderFutureChips(); renderWalked();
$('#btnRead').setAttribute('aria-pressed', prefs.read ? 'true' : 'false');
applyModel(); updateTime();
tickMovers(0.001);
requestAnimationFrame(frame);
const returning = hadState && (walkedN() > 0 || !!state.tour);
showWelcome(returning ? R.welcome.length - 1 : 0);

window.__REALM_APP = { w2s: worldToScreen, s2w: screenToWorld, startChapter, stopChapter, next, prev, pause, play, choose: (key, id) => { const t = T.trail[T.idx]; if (!t || !t.b.fork || t.b.fork.key !== key) return false; const o = t.b.fork.options.find(x => x.id === id); if (o) choose(t, o); return !!o; }, T, state, params, collectScript, openPop, openChapters, openList, openGateInv, enterWander, setRead, showWelcome, setLensMode, cam, camT, speakNow, popItems, VO };
})();

</script>
